<text x="425.0" y="105.8" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5E5950" text-anchor="middle" font-weight="normal">paid later</text>
<rect x="175" y="190" width="200" height="72" rx="6" fill="#F3F1EC" stroke="#D3CEC4" stroke-width="1.5"/>
<text x="275.0" y="212.8" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1A1814" text-anchor="middle" font-weight="bold">Marketplace</text>
<text x="275.0" y="230.8" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5E5950" text-anchor="middle" font-weight="normal">holds funds, rules</text>
<text x="275.0" y="248.8" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5E5950" text-anchor="middle" font-weight="normal">on disputes</text>
