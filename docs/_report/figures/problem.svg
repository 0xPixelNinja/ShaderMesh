<text x="275" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B91C1C" text-anchor="middle" font-weight="normal">Single point of trust and failure</text>
<text x="275" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B91C1C" text-anchor="middle" font-weight="normal">Opaque reputation and fees</text>
<text x="275" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B91C1C" text-anchor="middle" font-weight="normal">No proof the hours were served</text>
<rect x="590" y="60" width="170" height="64" rx="6" fill="#FFFFFF" stroke="#1A1814" stroke-width="1.5"/>
<text x="675.0" y="87.8" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1A1814" text-anchor="middle" font-weight="bold">Requester</text>
<text x="675.0" y="105.8" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5E5950" text-anchor="middle" font-weight="normal">funds escrow</text>
<rect x="890" y="60" width="170" height="64" rx="6" fill="#FFFFFF" stroke="#1A1814" stroke-width="1.5"/>
<text x="975.0" y="87.8" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1A1814" text-anchor="middle" font-weight="bold">Provider</text>
<text x="975.0" y="105.8" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5E5950" text-anchor="middle" font-weight="normal">stakes collateral</text>
<rect x="705" y="190" width="240" height="72" rx="6" fill="#FDF3E1" stroke="#D97706" stroke-width="1.5"/>
<text x="825.0" y="221.8" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#A34A06" text-anchor="middle" font-weight="bold">Smart contracts</text>
<text x="825.0" y="239.8" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#A34A06" text-anchor="middle" font-weight="normal">escrow, stake, slashing</text>
<path d="M675.0,124.0 L754.5,185.7" fill="none" stroke="#1A1814" stroke-width="1.5" stroke-linejoin="round"/>
