<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
<rect width="1100" height="360" fill="#FFFFFF"/>
<text x="275" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1A1814" text-anchor="middle" font-weight="bold">Today: a central operator</text>
<text x="825" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#A34A06" text-anchor="middle" font-weight="bold">ShaderMesh: contracts as the trusted party</text>
<path d="M550.0,14.0 L550.0,346.0" fill="none" stroke="#D3CEC4" stroke-width="1.25" stroke-linejoin="round"/>
