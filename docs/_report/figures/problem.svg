<path d="M969.5,128.3 L895.5,185.7" fill="none" stroke="#1A1814" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="890.0,190.0 894.7,181.3 899.6,187.6" fill="#1A1814"/>
<polygon points="975.0,124.0 970.3,132.7 965.4,126.4" fill="#1A1814"/>
<text x="825" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#137535" text-anchor="middle" font-weight="normal">Paid per interval with signed heartbeats</text>
<text x="825" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#137535" text-anchor="middle" font-weight="normal">Public stake, reputation, and history</text>
<text x="825" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#137535" text-anchor="middle" font-weight="normal">Missed service is refunded or slashed</text>
