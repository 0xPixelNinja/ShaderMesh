name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run gas

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements-dev.txt
      - run: npm ci
        working-directory: contracts
      - run: pip install -r requirements-dev.txt
        working-directory: agent
      - run: python -m pytest
        working-directory: agent

  orchestrator:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shadermesh
          POSTGRES_PASSWORD: shadermesh
          POSTGRES_DB: shadermesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadermesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: orchestrator
    env:
      TEST_DATABASE_URL: postgres://shadermesh:shadermesh@127.0.0.1:5432/shadermesh_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -v
      - run: python verification_game_sim.py

  full-stack:
    runs-on: ubuntu-latest
    needs: [contracts, agent, orchestrator, web, simulator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: docker compose up --build -d
      - name: Wait for services
        shell: bash
        run: |
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000 >/dev/null \
              && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - run: docker compose exec -T orchestrator npm run smoke:inference
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - if: always()
        run: docker compose down -v
