# ShaderMesh local stack.
#
#   docker compose up --build                 # full seeded stack
#
# Boot order is enforced with healthchecks + depends_on:
#   chain (hardhat node) -> deployer (deploys + writes addresses) -> services
# Contract addresses are shared via the `deployments` named volume.
name: shadermesh

services:
  # --- Local Ethereum dev chain (deterministic hardhat node) ----------------
  chain:
    build:
      context: ./contracts
    image: shadermesh/contracts
    command: npx hardhat node --hostname 0.0.0.0
    ports:
      - "8545:8545"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},body:'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30

  # --- One-shot: deploy contracts and publish addresses to a shared volume --
  deployer:
    image: shadermesh/contracts
    depends_on:
      chain:
        condition: service_healthy
    environment:
      RPC_URL: http://chain:8545
    command: npx hardhat run scripts/deploy.ts --network docker
    volumes:
      - deployments:/app/deployments
    restart: "no"

  # --- Content-addressed storage for inputs/outputs -------------------------
  ipfs:
    image: ipfs/kubo@sha256:63f5502f7a01b82a675e45bae81b2f5dfa90248ec4a86cd0a58c218347e1f2d2
    ports:
      - "5001:5001" # API
      - "8080:8080" # gateway
    volumes:
      - ipfs_data:/data/ipfs
    restart: unless-stopped

  # --- Off-chain index / dashboard datastore --------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shadermesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shadermesh}
      POSTGRES_DB: ${POSTGRES_DB:-shadermesh}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shadermesh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Thin coordinator: split / index / stitch -----------------------------
  orchestrator:
    build:
      context: ./orchestrator
    image: shadermesh/orchestrator
    depends_on:
      chain:
        condition: service_healthy
      deployer:
        condition: service_completed_successfully
      ipfs:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      RPC_URL: http://chain:8545
      IPFS_API_URL: http://ipfs:5001
      DATABASE_URL: postgres://${POSTGRES_USER:-shadermesh}:${POSTGRES_PASSWORD:-shadermesh}@postgres:5432/${POSTGRES_DB:-shadermesh}
      DEPLOYMENTS_FILE: /app/deployments/docker.json
      PORT: "4000"
      PROVIDER_HOST_ALLOWLIST: provider
    volumes:
      - deployments:/app/deployments:ro
    ports:
      - "4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Provider node: inference plus lease-bound sandboxed workloads ---------
  provider:
    build:
      context: ./agent
    image: shadermesh/agent
    depends_on:
      seed:
        condition: service_completed_successfully
    command: python serve_provider.py
    environment:
      RPC_URL: http://chain:8545
      DEPLOYMENTS_FILE: /app/deployments/docker.json
      # Hardhat account #1. Test-only and safe only for this local demo.
      PROVIDER_PRIVATE_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      INFERENCE_PORT: "8100"
      # Serve real models from the host GPU via Ollama.
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      MODELS: ${MODELS:-gemma3:4b,qwen3:0.6b}
      INFERENCE_PRICE_SMESH_PER_1K_TOKENS: "0.002"
      CAPABILITIES: '{"gpu":"NVIDIA GeForce RTX 4070 Laptop GPU","vram":8,"cpu":"host","region":"local"}'
      RENTAL_SPEC: '{"gpu":"RTX 4070 Laptop GPU","vram":8,"region":"local","models":["gemma3:4b","qwen3:0.6b"],"endpoint":"http://provider:8100"}'
      # Short interval and fast polling so settlement is visible during a live demo.
      # Price is per interval: 0.02 per 60s interval reads as $1.20/hr in the UI.
      RENTAL_INTERVAL_SECS: ${RENTAL_INTERVAL_SECS:-60}
      RENTAL_PRICE_USD: ${RENTAL_PRICE_USD:-0.02}
      POLL_SECS: ${POLL_SECS:-10}
      # A provider-approved local workload. Production images require a sha256 digest.
      LEASE_ALLOWED_MANIFEST: ${DEMO_LEASE_MANIFEST:-ipfs://bafybeigdyrzt5sfp7udm7hu76uh7y26nf3ayu5ol5qi2ngv3a6h4q}
      LEASE_WORKLOAD_IMAGE: shadermesh/agent
      LEASE_WORKLOAD_COMMAND: '["python","-c","import time; time.sleep(86400)"]'
      LEASE_ALLOW_MUTABLE_IMAGE: "true"
      LEASE_MEMORY_LIMIT: 512m
      LEASE_CPU_COUNT: "0.5"
      LEASE_PIDS_LIMIT: "64"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - deployments:/app/deployments:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8100:8100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/v1/models', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- One-shot: seed real listings and a lease so the dashboard is populated -
  seed:
    image: shadermesh/agent
    depends_on:
      chain:
        condition: service_healthy
      deployer:
        condition: service_completed_successfully
    environment:
      RPC_URL: http://chain:8545
      DEPLOYMENTS_FILE: /app/deployments/docker.json
      DEMO_LEASE_INTERVALS: "144"
      DEMO_LEASE_MANIFEST: ${DEMO_LEASE_MANIFEST:-ipfs://bafybeigdyrzt5sfp7udm7hu76uh7y26nf3ayu5ol5qi2ngv3a6h4q}
    command: python seed_demo.py
    volumes:
      - deployments:/app/deployments:ro
    restart: "no"

  # --- Dashboard ------------------------------------------------------------
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_DEFAULT_LEASE_MANIFEST: ${DEMO_LEASE_MANIFEST:-ipfs://bafybeigdyrzt5sfp7udm7hu76uh7y26nf3ayu5ol5qi2ngv3a6h4q}
    image: shadermesh/web
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  deployments:
  ipfs_data:
  pg_data:
